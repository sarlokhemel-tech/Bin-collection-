name: Auto Clone and Build ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Source Repository
      uses: actions/checkout@v4
      with:
        repository: 'Alexxdal/ESP32WifiPhisher'  # যে প্রজেক্টটি বিল্ড করতে চান তার গিটহাব ইউজারনেম/রিপোজিটরি
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Run PlatformIO Build
      run: pio run -e esp32

    - name: Archive Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ESP32-Binaries
        path: |
          .pio/build/esp32/firmware.bin
          .pio/build/esp32/bootloader.bin
          .pio/build/esp32/partitions.bin
          
