name: Build ESP32 Binaries

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Run PlatformIO Build
      # যদি platformio.ini ফাইলটি কোনো সাব-ফোল্ডারে থাকে, তবে নিচে working-directory তে সেই ফোল্ডারের নাম দিতে হবে।
      # যদি সোর্স কোড সরাসরি রুটে থাকে কিন্তু ফাইলে নাম বা পাথ নিয়ে সমস্যা হয়, তবে নিচের মতো করে রান করতে পারেন:
      run: pio run -e esp32
      # working-directory: ./SubFolderName  <-- যদি কোনো সাব-ফোল্ডারে থাকে তবে এই লাইনটি অন করে ফোল্ডারের নাম দেবেন

    - name: Archive Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ESP32-Binaries
        path: |
          .pio/build/esp32/firmware.bin
          .pio/build/esp32/bootloader.bin
          .pio/build/esp32/partitions.bin
          
